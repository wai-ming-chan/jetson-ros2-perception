/**:
  ros__parameters:
    sensor_id: 0

    # Verified modes only -- the 2-lane CSI on this carrier exposes exactly two.
    # Anything else fails to negotiate. See PROGRESS.md.
    #   3840 x 2160 @ 30
    #   1920 x 1080 @ 60
    width: 1920
    height: 1080
    framerate: 60

    # nvvidconv flip-method: 0=none 1=ccw90 2=180 3=cw90 4=horiz 5,6=diag 7=vert
    flip_method: 0

    frame_id: camera_optical_frame

    # Argus AE needs time to converge; the first frames are black or full-scale noise.
    warmup_frames: 30

    # Leave empty for auto exposure/gain. Populate only for diagnostics or fixed-exposure
    # capture. Units: exposure in nanoseconds, as "min max".
    # A 33 ms exposure cannot be sustained at 60 fps -- drop framerate to 30 first.
    exposure_time_range: ""
    gain_range: ""

    # Where camera_info_manager reads intrinsics from -- and, critically, where
    # cameracalibrator's COMMIT button writes them.
    #
    # This MUST point at a mounted volume. The default (~/.ros/camera_info/imx477.yaml)
    # lives inside the container, and docker/run.sh runs with --rm, so a successful
    # calibration would be destroyed the moment the container exits. /workspace is the
    # repo bind-mount, so writes land in git-tracked source on the host.
    #
    # NOTE the _1080p suffix: intrinsics are resolution-specific. Switching width/height
    # means switching this file too, or the geometry is silently wrong.
    camera_info_url: "file:///workspace/src/jetson_camera/config/imx477_1080p.yaml"

    # JPEG quality for the /image_raw/compressed stream (the operator console's feed).
    # This build of compressed_image_transport reads the value ONLY when the publisher is
    # created -- `ros2 param set` at runtime reports success but changes nothing (verified:
    # frame size 1257 KB before, 1258 KB after). It must be set here, before startup.
    # At the default (80), 1080p frames are ~1.3 MB; encoding them costs the capture loop
    # ~28 Hz of its 60 while a viewer is subscribed, and moving them limits the browser.
    image_raw.jpeg_quality: 60
