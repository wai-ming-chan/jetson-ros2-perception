# Socket buffers for ROS 2 / CycloneDDS with large messages.
#
# A raw 1920x1080 bgr8 frame is 6.2 MB. The kernel default rmem_max of 208 KB holds
# 1/30th of one, so DDS fragments overflow the buffer mid-message: best-effort
# subscribers received NOTHING (any lost fragment discards the whole frame) and reliable
# subscribers limped at 3.2 Hz on retransmissions.
#
# This grants the capacity; docker/cyclonedds.xml must also REQUEST it (via
# CYCLONEDDS_URI). Both halves are required.
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
